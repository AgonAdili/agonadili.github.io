    <g fill="#8B8B7D" font-family="Arial, sans-serif" font-size="8"><text x="103" y="406">We create spaces that feel as good as</text><text x="103" y="420">they look. Made for people. Designed</text><text x="103" y="434">to belong.</text></g>
